name: Publish tested VPN stability APK (one time)

on:
  push:
    branches:
      - arena/292fb282-netfixmobile

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: startsWith(github.event.head_commit.message, 'Publish tested VPN stability APK')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Wait for both Android test jobs and publish the verified APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=43628726633
          expected_commit=aeee2f346bdbd1f10bcbebb6c8800f5b79b27312
          gh run watch "$run_id" --exit-status
          head=$(gh run view "$run_id" --json headSha --jq '.headSha')
          [[ "$head" == "$expected_commit" ]]
          job=$(gh run view "$run_id" --json jobs --jq '.jobs[] | select(.name == "build (34)" and .conclusion == "success") | .databaseId')
          [[ -n "$job" ]]
          blob=$(gh api "repos/$GH_REPO/check-runs/$job/annotations" --jq '.[] | select(.title == "Debug APK blob") | .message')
          [[ "$blob" =~ ^[0-9a-f]{40}$ ]]
          apk=/tmp/NetFix-Mobile-vpn-stability-debug.apk
          gh api -H 'Accept: application/vnd.github.raw' "repos/$GH_REPO/git/blobs/$blob" > "$apk"
          [[ "$(git hash-object "$apk")" == "$blob" ]]
          sha256sum "$apk"
          gh release create debug-vpn-stability-aeee2f3 "$apk" \
            --target "$expected_commit" \
            --prerelease \
            --title 'NetFix Mobile — тестовое исправление переподключений VPN' \
            --notes 'Исправлен цикл перезапуска VPN при появлении собственной VPN-сети. Проверено unit-тестами и на Android 10 и 14. Эта debug-сборка устанавливается отдельно от официальной; для замены предыдущей тестовой сборки может понадобиться её удалить из-за другой подписи.'
