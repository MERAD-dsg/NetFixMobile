name: Android debug build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run unit tests and assemble debug APK
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 -Pnetfix.sideBySideDebug=true testDebugUnitTest assembleDebug 2>&1 | tee /tmp/netfix-gradle.log
      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify native video transport on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash -o pipefail -c './gradlew --no-daemon --max-workers=2 -Pnetfix.sideBySideDebug=true connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.rupleide.netfix.core.dpibypass.VideoTransportSmokeTest 2>&1 | tee /tmp/netfix-instrumented.log'
      - name: Upload build and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netfix-debug-results
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/outputs/androidTest-results/connected/**/*.xml
            /tmp/netfix-gradle.log
            /tmp/netfix-instrumented.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Export build results for the workspace
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          export_blob() {
            local file="$1" title="$2"
            [[ -f "$file" ]] || return 0
            python3 - "$file" <<'PY' > /tmp/blob.json
          import base64, json, sys
          with open(sys.argv[1], 'rb') as data:
              json.dump({'content': base64.b64encode(data.read()).decode('ascii'), 'encoding': 'base64'}, sys.stdout)
          PY
            local sha
            sha=$(gh api -X POST "repos/$REPOSITORY/git/blobs" --input /tmp/blob.json --jq '.sha')
            echo "::notice title=$title::$sha"
          }
          export_blob /tmp/netfix-gradle.log 'Gradle log blob'
          export_blob /tmp/netfix-instrumented.log 'Android test log blob'
          if [[ -d app/build/test-results/testDebugUnitTest ]]; then
            tar -czf /tmp/netfix-unit-results.tar.gz -C app/build/test-results/testDebugUnitTest .
            export_blob /tmp/netfix-unit-results.tar.gz 'Unit test results blob'
          fi
          apk=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit 2>/dev/null || true)
          [[ -z "$apk" ]] || export_blob "$apk" 'Debug APK blob'
